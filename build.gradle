plugins {
    id 'java'
    id("com.gradleup.shadow") version "8.3.11"
}

group "net.bdew.wurm"
version "0.4"

repositories {
    mavenCentral()
    maven { url "https://gotti.no-ip.org/maven/repository" }
}

dependencies {
    implementation 'org.gotti.wurmunlimited:common:2182584'
    implementation 'org.xerial:sqlite-jdbc:3.54.1.0'
    implementation 'com.google.code.gson:gson:2.15.0'
}

shadowJar {
    archiveClassifier = "";
    manifest {
        attributes 'Main-Class': 'com.wyverngame.mapviewer.MapViewer'
    }
}